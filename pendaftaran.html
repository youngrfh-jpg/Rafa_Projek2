<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Kursus - CodeCraft Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fdf2f8; color: #4a5568; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-gradient-to-br from-pink-100 via-purple-50 to-indigo-100">

    <!-- Top Navigation Cute -->
    <header class="border-b border-pink-200 bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-auto sm:h-20 py-3 sm:py-0 flex flex-col sm:flex-row items-center justify-between gap-3">
            <a href="index.html" class="flex items-center space-x-3 group cursor-pointer">
                <span class="bg-pink-400 group-hover:bg-pink-300 text-white font-extrabold px-3 py-1.5 rounded-2xl text-lg transition shadow-md">{ }</span>
                <span class="text-xl font-black tracking-wider text-pink-600 uppercase">CODECRAFT <span class="text-purple-400 text-xs tracking-normal block font-semibold">Academy </span></span>
            </a>
            <nav class="flex items-center space-x-2 bg-pink-50 p-1.5 rounded-full border border-pink-200">
                <a href="index.html" class="px-5 py-2 text-xs sm:text-sm font-bold text-pink-500 hover:text-pink-600 hover:bg-pink-100/50 rounded-full transition cursor-pointer">
                    Galeri Kegiatan
                </a>
                <a href="pendaftaran.html" class="px-5 py-2 text-xs sm:text-sm font-bold text-white bg-pink-400 rounded-full transition shadow-md cursor-pointer">
                    Form Pendaftaran
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content: Form Pendaftaran -->
    <main class="max-w-3xl mx-auto px-6 py-12 flex-grow w-full">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-pink-600 tracking-tight mb-2">Formulir Pendaftaran Kursus </h1>
            <p class="text-gray-500 text-sm font-medium">Silakan isi data diri Anda dengan benar untuk mendaftar ke program CodeCraft Academy.</p>
        </div>

        <!-- Card Form Cute -->
        <div class="bg-white/80 backdrop-blur-md border border-pink-200 rounded-3xl p-6 sm:p-10 shadow-xl">
            <form id="formPendaftaran" onsubmit="handleFormSubmit(event)" class="space-y-6">
                
                <!-- NIK -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-pink-500 mb-2">NIK *</label>
                    <input type="text" id="nik" required placeholder="Masukkan 16 digit NIK Anda" 
                        class="w-full bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3.5 text-gray-700 placeholder-pink-300 text-sm focus:outline-none focus:border-pink-400 focus:bg-white transition">
                </div>

                <!-- Nama Lengkap -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-pink-500 mb-2">Nama Lengkap *</label>
                    <input type="text" id="nama" required placeholder="Nama Sesuai KTP" 
                        class="w-full bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3.5 text-gray-700 placeholder-pink-300 text-sm focus:outline-none focus:border-pink-400 focus:bg-white transition">
                </div>

                <!-- Jenis Kelamin -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-pink-500 mb-2">Jenis Kelamin *</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center space-x-3 bg-pink-50/50 border border-pink-200 p-3.5 rounded-2xl cursor-pointer hover:bg-white transition">
                            <input type="radio" name="gender" value="Laki-laki" required class="accent-pink-400 h-4 w-4">
                            <span class="text-sm font-semibold text-gray-700">Laki-laki</span>
                        </label>
                        <label class="flex items-center space-x-3 bg-pink-50/50 border border-pink-200 p-3.5 rounded-2xl cursor-pointer hover:bg-white transition">
                            <input type="radio" name="gender" value="Perempuan" required class="accent-pink-400 h-4 w-4">
                            <span class="text-sm font-semibold text-gray-700">Perempuan</span>
                        </label>
                    </div>
                </div>

                <!-- No. HP / WhatsApp -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-pink-500 mb-2">No. HP / WhatsApp *</label>
                    <input type="tel" id="phone" required placeholder="08xxxxxxxxxx" 
                        class="w-full bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3.5 text-gray-700 placeholder-pink-300 text-sm focus:outline-none focus:border-pink-400 focus:bg-white transition">
                </div>

                <!-- Alamat -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-pink-500 mb-2">Alamat Domisili *</label>
                    <textarea id="address" required rows="3" placeholder="Masukkan alamat lengkap Anda" 
                        class="w-full bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3.5 text-gray-700 placeholder-pink-300 text-sm focus:outline-none focus:border-pink-400 focus:bg-white transition"></textarea>
                </div>

                <!-- Program -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-pink-500 mb-2">Program / Bahasa yang Diminati *</label>
                    <select id="program" required 
                        class="w-full bg-pink-50/50 border border-pink-200 rounded-2xl px-4 py-3.5 text-gray-700 text-sm focus:outline-none focus:border-pink-400 focus:bg-white transition">
                        <option value="" disabled selected>-- Pilih Program Kursus --</option>
                        <option value="Full-Stack Web Development">Full-Stack Web Development</option>
                        <option value="Python Dasar & Data Science">Python Dasar & Data Science</option>
                        <option value="Java & Konsep OOP">Java & Konsep OOP</option>
                    </select>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-extrabold py-4 rounded-2xl text-sm transition shadow-lg shadow-pink-300/50 cursor-pointer">
                    Kirim Pendaftaran 
                </button>
            </form>
        </div>

        <!-- Output Result -->
        <div id="resultCard" class="hidden mt-10 bg-white border border-pink-300 rounded-3xl p-6 sm:p-8 shadow-xl">
            <h3 class="text-xl font-extrabold text-pink-600 mb-4 flex items-center gap-2">
                <span> </span> Pendaftaran Berhasil Disimpan!
            </h3>
            <div id="outputContent" class="space-y-3 text-sm text-gray-600 border-t border-pink-100 pt-4">
                <!-- Data dimasukkan via JS -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-pink-200 bg-white/60 py-8 text-center text-xs text-pink-400 font-bold mt-12">
        <p>&copy; 2026 CodeCraft Academy . All Rights Reserved.</p>
    </footer>

    <!-- Script -->
    <script>
        function handleFormSubmit(event) {
            event.preventDefault();

            const nik = document.getElementById('nik').value;
            const nama = document.getElementById('nama').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const program = document.getElementById('program').value;

            const konfirmasi = confirm("Apakah Anda yakin data pendaftaran yang diisi sudah benar?");
            if (!konfirmasi) return;

            const outputContent = document.getElementById('outputContent');
            outputContent.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 font-medium">
                    <div><strong class="text-pink-400 block text-xs uppercase">NIK:</strong> <span class="text-gray-700">${nik}</span></div>
                    <div><strong class="text-pink-400 block text-xs uppercase">Nama Lengkap:</strong> <span class="text-gray-700">${nama}</span></div>
                    <div><strong class="text-pink-400 block text-xs uppercase">Jenis Kelamin:</strong> <span class="text-gray-700">${gender}</span></div>
                    <div><strong class="text-pink-400 block text-xs uppercase">No. WhatsApp:</strong> <span class="text-gray-700">${phone}</span></div>
                    <div class="sm:col-span-2"><strong class="text-pink-400 block text-xs uppercase">Alamat Domisili:</strong> <span class="text-gray-700">${address}</span></div>
                    <div class="sm:col-span-2"><strong class="text-pink-400 block text-xs uppercase">Program Pilihan:</strong> <span class="text-pink-600 font-bold">${program}</span></div>
                </div>
            `;

            document.getElementById('resultCard').classList.remove('hidden');
            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
